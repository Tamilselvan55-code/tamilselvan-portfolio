    <!-- Initial Loader to prevent React mounting flash -->
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #F7F5F1; /* Ivory background */
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #F7F5F1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader"></div>
    <div id="root"></div>
    <script type="module">
      // Remove initial loader as soon as React starts mounting
      const observer = new MutationObserver((mutations, obs) => {
        const loader = document.getElementById('initial-loader');
        if (document.getElementById('root').hasChildNodes() && loader) {
          loader.remove();
          obs.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
